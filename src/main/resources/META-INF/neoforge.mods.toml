modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"

# Spell Engine's NeoForge modId -- must load before us, and this mod is useless without it.
[[dependencies.${mod_id}]]
    modId = "spell_engine"
    type = "required"
    versionRange = "[1.9.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "${mod_id}.mixins.json"
